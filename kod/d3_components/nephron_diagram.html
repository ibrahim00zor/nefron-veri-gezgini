<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: transparent; }
    
    .tooltip {
      position: absolute; text-align: left; padding: 10px 14px; font-size: 12px;
      background: rgba(255,255,255,0.97); border: 1px solid #d1d5db; border-radius: 8px;
      pointer-events: none; opacity: 0; z-index: 100;
      box-shadow: 0 8px 25px -5px rgba(0,0,0,0.12), 0 4px 10px -5px rgba(0,0,0,0.06);
      transition: opacity 0.15s ease; max-width: 260px; line-height: 1.5;
    }
    .tooltip .tt-title { font-size: 14px; font-weight: 700; color: #111827; margin-bottom: 4px; }
    .tooltip .tt-row { display: flex; justify-content: space-between; gap: 12px; }
    .tooltip .tt-label { color: #6b7280; }
    .tooltip .tt-val { font-weight: 600; color: #1e3a8a; }
    .tooltip hr { border: none; border-top: 1px solid #e5e7eb; margin: 5px 0; }

    .segment-path { cursor: pointer; transition: filter 0.2s, opacity 0.2s; }
    .segment-path:hover { filter: brightness(0.85) drop-shadow(0 0 6px rgba(0,0,0,0.25)); }
    
    .zone-label {
      font-size: 11px; fill: #9ca3af; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
    }
    .seg-label { font-size: 10px; fill: #374151; font-weight: 600; letter-spacing: 0.03em; }
    .osm-label { font-size: 10px; fill: #92400e; font-weight: 500; }
    .legend-title { font-size: 11px; fill: #374151; font-weight: 600; }
    .legend-tick { font-size: 10px; fill: #6b7280; }
    .glom-label { font-size: 11px; fill: #991b1b; font-weight: 700; }
  </style>
</head>
<body>
  <div id="diagram"></div>
  <div id="tooltip" class="tooltip"></div>

  <script>
    // ============================================================
    // DATA (Python injects here)
    // ============================================================
    const D = JSON.parse('__INJECTED_DATA__');

    const W = 680, H = 940;
    const svg = d3.select("#diagram").append("svg")
      .attr("viewBox", `0 0 ${W} ${H}`)
      .attr("width", "100%")
      .attr("preserveAspectRatio", "xMidYMid meet");

    const defs = svg.append("defs");

    // ============================================================
    // MADDE 3: Kortikomeduller ozmolalite gradyan arka plani
    // ============================================================
    const stops = D.gradient_stops || [];
    if (stops.length >= 2) {
      // Renk paleti: acik krem (korteks) → koyu amber (papilla)
      const osmMin = d3.min(stops, d => d.osm);
      const osmMax = d3.max(stops, d => d.osm);
      const osmColor = d3.scaleSequential(d3.interpolateYlOrBr).domain([osmMin - 50, osmMax + 100]);

      const bgGrad = defs.append("linearGradient")
        .attr("id", "bg-osm-grad")
        .attr("x1", "0%").attr("y1", "0%")
        .attr("x2", "0%").attr("y2", "100%");

      stops.forEach(s => {
        bgGrad.append("stop")
          .attr("offset", `${s.frac * 100}%`)
          .attr("stop-color", osmColor(s.osm));
      });

      svg.append("rect")
        .attr("x", 0).attr("y", 0).attr("width", W).attr("height", H)
        .attr("fill", "url(#bg-osm-grad)").attr("opacity", 0.35);

      // Zone sinirlari (ince kesikli cizgi)
      const zoneBounds = [
        { y: H * 0.27, label: "Korteks" },
        { y: H * 0.55, label: "Dış Medulla" },
        { y: H * 0.56, label: "İç Medulla" }
      ];
      zoneBounds.forEach(z => {
        svg.append("line")
          .attr("x1", 0).attr("y1", z.y).attr("x2", W).attr("y2", z.y)
          .attr("stroke", "#d4a574").attr("stroke-width", 0.8)
          .attr("stroke-dasharray", "6,4").attr("opacity", 0.5);
      });
      // Zone labels (sol kenar)
      svg.append("text").attr("class", "zone-label").attr("x", 12).attr("y", 25).text("Korteks");
      svg.append("text").attr("class", "zone-label").attr("x", 12).attr("y", H * 0.28 + 18).text("Dış Medulla");
      svg.append("text").attr("class", "zone-label").attr("x", 12).attr("y", H * 0.57 + 18).text("İç Medulla");

      // Ozmolalite lejanidi (sag kenar, dikey cubuk)
      const osmLegH = 300, osmLegX = W - 55, osmLegY = H * 0.35;
      const osmLegGrad = defs.append("linearGradient")
        .attr("id", "osm-leg-grad")
        .attr("x1", "0%").attr("y1", "0%").attr("x2", "0%").attr("y2", "100%");
      for (let i = 0; i <= 10; i++) {
        osmLegGrad.append("stop")
          .attr("offset", `${i * 10}%`)
          .attr("stop-color", osmColor(osmMin + (osmMax - osmMin) * (i / 10)));
      }
      svg.append("rect")
        .attr("x", osmLegX).attr("y", osmLegY)
        .attr("width", 12).attr("height", osmLegH)
        .attr("fill", "url(#osm-leg-grad)").attr("rx", 3).attr("opacity", 0.7);
      svg.append("text").attr("class", "osm-label")
        .attr("x", osmLegX + 6).attr("y", osmLegY - 8)
        .attr("text-anchor", "middle").text("mOsm");
      svg.append("text").attr("class", "osm-label")
        .attr("x", osmLegX - 4).attr("y", osmLegY + 6)
        .attr("text-anchor", "end").text(Math.round(osmMin));
      svg.append("text").attr("class", "osm-label")
        .attr("x", osmLegX - 4).attr("y", osmLegY + osmLegH + 4)
        .attr("text-anchor", "end").text(Math.round(osmMax));
    }

    // ============================================================
    // MADDE 1: Anatomik nefron topolojisi
    // ============================================================
    // Koordinatlar: y=0 korteks ustu, y~250 DM siniri, y~520 IM siniri, y~870 papilla
    // x: sol=inen kol, sag=cikan kol, uzak sag=toplayici kanal

    const topo = {
      // PT: kivrili proksimal tubul (cortex)
      "PT":   { pts: [[120,135],[140,120],[170,140],[200,125],[230,140],[255,128],[275,145]], baseW: 12 },
      // S3: proksimal duz kisim (korteks→DM gecisi)
      "S3":   { pts: [[275,145],[275,175],[270,210],[268,255]], baseW: 10 },
      // SDL: ince inen kol (DM icerisinde, korteks-medulla sinirindan baslar)
      "SDL":  { pts: [[268,255],[266,310],[264,380],[262,440],[260,510]], baseW: 5 },
      // LDL: ince inen kol devami (IM, sadece jux nefronlarda) — derin U-donusu
      "LDL":  { pts: [[260,510],[258,580],[257,650],[258,720],[262,780],[272,820],[290,845]], baseW: 5 },
      // LAL: ince cikan kol (IM, sadece jux nefronlarda) — derin U-donusu
      "LAL":  { pts: [[290,845],[308,825],[318,790],[324,730],[328,660],[330,590],[332,510]], baseW: 6 },
      // mTAL: kalin cikan kol - medullar kisim (inen kolun hemen yaninda yukari cikar)
      "mTAL": { pts: [[300,510],[302,440],[304,380],[306,310],[308,255]], baseW: 10 },
      // cTAL: kalin cikan kol - kortikal kisim  
      "cTAL": { pts: [[308,255],[310,210],[315,175],[320,145]], baseW: 10 },
      // DCT: distal kivrili tubul (korteks, kisa)
      "DCT":  { pts: [[320,145],[340,125],[365,140],[390,120],[415,140]], baseW: 9 },
      // CNT: baglayici tubul
      "CNT":  { pts: [[415,140],[438,130],[460,142]], baseW: 8 },
      // CCD: kortikal toplayici kanal
      "CCD":  { pts: [[460,142],[462,180],[464,220],[465,255]], baseW: 9 },
      // OMCD: dis medullar toplayici kanal
      "OMCD": { pts: [[465,255],[467,320],[469,400],[470,510]], baseW: 10 },
      // IMCD: ic medullar toplayici kanal (papillaya iner)
      "IMCD": { pts: [[470,510],[472,600],[474,700],[476,790],[477,870]], baseW: 12 },
    };

    // ============================================================
    // MADDE 2: Akisa (flow) gore dinamik kalinlik
    // ============================================================
    const flowMin = D.flow_min || 0.5;
    const flowMax = D.flow_max || 100;
    // stroke-width: akis degerine orantili, [3, 20] araliginda
    const thickScale = d3.scaleLinear().domain([flowMin, flowMax]).range([3, 20]).clamp(true);

    // ============================================================
    // Konsantrasyon renk skalasi
    // ============================================================
    const conMin = D.con_min || 0;
    const conMax = D.con_max || 300;
    const colorScale = d3.scaleSequential(d3.interpolateYlOrRd).domain([conMin, conMax]);

    // ============================================================
    // Glomerulus
    // ============================================================
    const glomG = svg.append("g").attr("transform", "translate(105, 120)");
    // Bowman kapsulu (dis daire)
    glomG.append("circle").attr("r", 22).attr("fill", "none").attr("stroke", "#dc2626").attr("stroke-width", 1.5).attr("opacity", 0.6);
    // Kapiller yumagi (ic daireler)
    [[-4,-3,6],[5,-2,5],[0,5,5],[-6,4,4],[6,5,4]].forEach(([cx,cy,r]) => {
      glomG.append("circle").attr("cx",cx).attr("cy",cy).attr("r",r)
        .attr("fill", "#ef4444").attr("opacity", 0.5).attr("stroke", "#dc2626").attr("stroke-width", 0.5);
    });
    svg.append("text").attr("class", "glom-label").attr("x", 105).attr("y", 90).attr("text-anchor", "middle").text("Glomerulus");
    // Afferent/efferent ok
    svg.append("text").attr("x", 65).attr("y", 118).attr("font-size", "9px").attr("fill", "#9ca3af").text("Aff →");
    svg.append("text").attr("x", 130).attr("y", 108).attr("font-size", "9px").attr("fill", "#9ca3af").text("→ Eff");

    // ============================================================
    // Segment cizimi (D3 path)
    // ============================================================
    const lineGen = d3.line().curve(d3.curveCatmullRom.alpha(0.5));
    const tooltip = d3.select("#tooltip");

    // Segment etiket pozisyonlari (okunabilirlik icin ayarlanmis)
    const labelPos = {
      "PT":   { x: 190, y: 108, anchor: "middle" },
      "S3":   { x: 243, y: 200, anchor: "end" },
      "SDL":  { x: 240, y: 400, anchor: "end" },
      "LDL":  { x: 235, y: 700, anchor: "end" },
      "LAL":  { x: 352, y: 700, anchor: "start" },
      "mTAL": { x: 325, y: 400, anchor: "start" },
      "cTAL": { x: 335, y: 200, anchor: "start" },
      "DCT":  { x: 368, y: 108, anchor: "middle" },
      "CNT":  { x: 440, y: 118, anchor: "middle" },
      "CCD":  { x: 488, y: 200, anchor: "start" },
      "OMCD": { x: 492, y: 400, anchor: "start" },
      "IMCD": { x: 498, y: 750, anchor: "start" },
    };

    // Hangi segmentler cizilecek? (sup nefronunda LDL/LAL yok)
    const isJux = D.nephron_type && D.nephron_type.startsWith("jux");
    const drawSegs = Object.keys(topo).filter(s => {
      if ((s === "LDL" || s === "LAL") && !isJux) return false;
      return true;
    });

    // SUP nefronlari icin hairpin U-donusu (SDL sonu → mTAL basi)
    // Jux nefronlarinda bu donusu LDL→LAL zaten yapar
    if (!isJux) {
      const sdlEnd = topo["SDL"].pts[topo["SDL"].pts.length - 1];
      const mtalStart = topo["mTAL"].pts[0];
      const midX = (sdlEnd[0] + mtalStart[0]) / 2;
      const loopY = sdlEnd[1] + 45; // DM/IM sinirina yakin U-donusu
      const hairpinPts = [
        sdlEnd,
        [sdlEnd[0] - 2, sdlEnd[1] + 15],
        [midX, loopY],
        [mtalStart[0] + 2, mtalStart[1] + 15],
        mtalStart
      ];
      svg.append("path")
        .attr("d", lineGen(hairpinPts))
        .attr("fill", "none")
        .attr("stroke", "#9ca3af")
        .attr("stroke-width", 4)
        .attr("stroke-linecap", "round")
        .attr("stroke-linejoin", "round")
        .attr("opacity", 0.7)
        .attr("stroke-dasharray", "none");
      // Hairpin etiketi
      svg.append("text")
        .attr("x", midX).attr("y", loopY + 16)
        .attr("text-anchor", "middle")
        .attr("font-size", "9px").attr("fill", "#9ca3af").attr("font-style", "italic")
        .text("Henle kulpu dönüşü");
    }

    for (const segName of drawSegs) {
      const t = topo[segName];
      const segCon = D.segments ? D.segments[segName] : null;
      const segFlow = D.flow ? D.flow[segName] : null;

      // Kalinlik: akis verisine gore veya baseline
      let sw = t.baseW;
      if (segFlow) {
        sw = thickScale(segFlow.mean);
      }

      // Renk: konsantrasyon gradyani veya gri (veri yoksa)
      let strokeColor = "#d1d5db";
      if (segCon) {
        const gradId = `con-grad-${segName}`;
        const pts = t.pts;
        const grad = defs.append("linearGradient")
          .attr("id", gradId)
          .attr("gradientUnits", "userSpaceOnUse")
          .attr("x1", pts[0][0]).attr("y1", pts[0][1])
          .attr("x2", pts[pts.length-1][0]).attr("y2", pts[pts.length-1][1]);
        grad.append("stop").attr("offset", "0%").attr("stop-color", colorScale(segCon.entry));
        grad.append("stop").attr("offset", "100%").attr("stop-color", colorScale(segCon.exit));
        strokeColor = `url(#${gradId})`;
      }

      // Segment cizimi
      svg.append("path")
        .attr("class", "segment-path")
        .attr("d", lineGen(t.pts))
        .attr("fill", "none")
        .attr("stroke", strokeColor)
        .attr("stroke-width", sw)
        .attr("stroke-linecap", "round")
        .attr("stroke-linejoin", "round")
        .on("mouseover", function(event) {
          d3.select(this).attr("stroke-width", sw + 4);
          let html = `<div class='tt-title'>${segName}</div><hr>`;
          if (segCon) {
            html += `
              <div class='tt-row'><span class='tt-label'>Giriş (${D.solute})</span><span class='tt-val'>${segCon.entry.toFixed(1)} mM</span></div>
              <div class='tt-row'><span class='tt-label'>Çıkış (${D.solute})</span><span class='tt-val'>${segCon.exit.toFixed(1)} mM</span></div>
              <div class='tt-row'><span class='tt-label'>Ort (${D.solute})</span><span class='tt-val'>${segCon.mean.toFixed(1)} mM</span></div>`;
          }
          if (segFlow) {
            html += `<hr>
              <div class='tt-row'><span class='tt-label'>Akış giriş</span><span class='tt-val'>${segFlow.entry.toFixed(2)} nl/min</span></div>
              <div class='tt-row'><span class='tt-label'>Akış çıkış</span><span class='tt-val'>${segFlow.exit.toFixed(2)} nl/min</span></div>`;
          }
          tooltip.html(html)
            .style("opacity", 1)
            .style("left", (event.pageX + 18) + "px")
            .style("top", (event.pageY - 30) + "px");
        })
        .on("mousemove", function(event) {
          tooltip.style("left", (event.pageX + 18) + "px").style("top", (event.pageY - 30) + "px");
        })
        .on("mouseout", function() {
          d3.select(this).attr("stroke-width", sw);
          tooltip.style("opacity", 0);
        });

      // Segment etiketi
      const lp = labelPos[segName];
      if (lp) {
        svg.append("text")
          .attr("class", "seg-label")
          .attr("x", lp.x).attr("y", lp.y)
          .attr("text-anchor", lp.anchor)
          .text(segName);
      }
    }

    // ============================================================
    // Konsantrasyon lejanidi (ust sag)
    // ============================================================
    const cLegW = 160, cLegH = 12;
    const cLeg = svg.append("g").attr("transform", `translate(${W - 220}, 20)`);
    const cLegGrad = defs.append("linearGradient").attr("id", "con-legend");
    for (let i = 0; i <= 10; i++) {
      cLegGrad.append("stop")
        .attr("offset", `${i*10}%`)
        .attr("stop-color", colorScale(conMin + (conMax - conMin) * i / 10));
    }
    cLeg.append("rect").attr("width", cLegW).attr("height", cLegH).attr("fill", "url(#con-legend)").attr("rx", 3);
    cLeg.append("text").attr("class", "legend-title").attr("y", -6).text(`${D.solute} Konsantrasyon (mM)`);
    cLeg.append("text").attr("class", "legend-tick").attr("y", cLegH + 12).text(conMin.toFixed(0));
    cLeg.append("text").attr("class", "legend-tick").attr("x", cLegW).attr("y", cLegH + 12).attr("text-anchor", "end").text(conMax.toFixed(0));

    // Akis lejanidi (ust sag, konsantrasyonun altinda)
    const fLeg = svg.append("g").attr("transform", `translate(${W - 220}, 58)`);
    fLeg.append("text").attr("class", "legend-title").attr("y", -4).text("Kalınlık ∝ Su Akışı (nl/min)");
    // ince cizgi
    fLeg.append("line").attr("x1", 0).attr("y1", 10).attr("x2", 30).attr("y2", 10)
      .attr("stroke", "#9ca3af").attr("stroke-width", 3).attr("stroke-linecap", "round");
    fLeg.append("text").attr("class", "legend-tick").attr("x", 35).attr("y", 14).text(flowMin.toFixed(1));
    // kalin cizgi
    fLeg.append("line").attr("x1", 90).attr("y1", 10).attr("x2", 120).attr("y2", 10)
      .attr("stroke", "#9ca3af").attr("stroke-width", 14).attr("stroke-linecap", "round");
    fLeg.append("text").attr("class", "legend-tick").attr("x", 128).attr("y", 14).text(flowMax.toFixed(1));

    // Idrar ok isareti (papilla cikis)
    svg.append("text")
      .attr("x", 477).attr("y", H - 40)
      .attr("font-size", "10px").attr("fill", "#92400e").attr("text-anchor", "middle")
      .text("↓ İdrar");

  </script>
</body>
</html>
