<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .tooltip {
      position: absolute;
      text-align: left;
      padding: 8px 12px;
      font-size: 13px;
      background: white;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      pointer-events: none;
      opacity: 0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      transition: opacity 0.1s;
    }
    .segment { cursor: pointer; transition: stroke-width 0.2s; }
    .segment:hover { stroke-width: 14; filter: brightness(0.9); }
    .zone-label { font-size: 14px; fill: #6b7280; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div id="diagram-container"></div>
  <div id="tooltip" class="tooltip"></div>

  <script>
    // Python will replace this token with actual JSON data
    const INJECTED_DATA = /*DATA_PLACEHOLDER*/ {"solute": "Na", "min_val": 0, "max_val": 300}; 

    const width = 600;
    const height = 900;
    const svg = d3.select("#diagram-container")
      .append("svg")
      .attr("viewBox", `0 0 ${width} ${height}`)
      .attr("width", "100%")
      .attr("height", "100vh");

    // Background Zones
    const zones = [
      {name: "Korteks", y: 0, h: 250, fill: "#fdfbf7"},
      {name: "Dış Medulla", y: 250, h: 250, fill: "#f8f3eb"},
      {name: "İç Medulla", y: 500, h: 400, fill: "#f0e6d6"}
    ];

    svg.selectAll(".zone")
      .data(zones)
      .enter().append("rect")
      .attr("class", "zone")
      .attr("x", 0)
      .attr("y", d => d.y)
      .attr("width", width)
      .attr("height", d => d.h)
      .attr("fill", d => d.fill);

    svg.selectAll(".zone-label")
      .data(zones)
      .enter().append("text")
      .attr("class", "zone-label")
      .attr("x", 20)
      .attr("y", d => d.y + 30)
      .text(d => d.name);

    // Nefron Topology (Simplified coordinates)
    const topology = {
      "PT": [[100,150], [150,150]],
      "S3": [[150,150], [150,250]],
      "SDL": [[150,250], [150,500]],
      "LDL": [[150,500], [150,750], [160, 800], [180, 810], [200, 810]], 
      "LAL": [[200,810], [220, 810], [240, 800], [250, 750], [250,500]], 
      "mTAL": [[250,500], [250,250]],
      "cTAL": [[250,250], [250,150]],
      "DCT": [[250,150], [300,100], [350,150]],
      "CNT": [[350,150], [450,150]],
      "CCD": [[450,150], [450,250]],
      "OMCD": [[450,250], [450,500]],
      "IMCD": [[450,500], [450,850]]
    };

    // Glomerulus symbol
    svg.append("circle")
      .attr("cx", 100)
      .attr("cy", 150)
      .attr("r", 15)
      .attr("fill", "#dc2626")
      .attr("opacity", 0.8);
    
    svg.append("text")
      .attr("x", 85)
      .attr("y", 125)
      .attr("font-size", "12px")
      .attr("font-weight", "bold")
      .attr("fill", "#991b1b")
      .text("Glomerulus");

    // Color scale for the heatmap
    const minV = INJECTED_DATA.min_val || 0;
    const maxV = INJECTED_DATA.max_val || 100;
    const colorScale = d3.scaleSequential(d3.interpolateYlOrRd).domain([minV, maxV]);

    const defs = svg.append("defs");
    const lineGen = d3.line().curve(d3.curveCatmullRom.alpha(0.5));
    const tooltip = d3.select("#tooltip");

    for (const [segName, pts] of Object.entries(topology)) {
      const segData = INJECTED_DATA.segments ? INJECTED_DATA.segments[segName] : null;
      let strokeColor = "#e5e7eb"; // default empty color

      if (segData) {
        // Create a linear gradient for this segment
        const gradId = `grad-${segName}`;
        const grad = defs.append("linearGradient")
          .attr("id", gradId)
          .attr("gradientUnits", "userSpaceOnUse")
          .attr("x1", pts[0][0]).attr("y1", pts[0][1])
          .attr("x2", pts[pts.length-1][0]).attr("y2", pts[pts.length-1][1]);
        
        grad.append("stop").attr("offset", "0%").attr("stop-color", colorScale(segData.entry));
        grad.append("stop").attr("offset", "100%").attr("stop-color", colorScale(segData.exit));
        
        strokeColor = `url(#${gradId})`;
      }

      svg.append("path")
        .attr("class", "segment")
        .attr("d", lineGen(pts))
        .attr("fill", "none")
        .attr("stroke", strokeColor)
        .attr("stroke-width", 10)
        .attr("stroke-linecap", "round")
        .attr("stroke-linejoin", "round")
        .on("mouseover", function(event) {
          if (!segData) return;
          d3.select(this).style("stroke-width", 14);
          tooltip.transition().duration(100).style("opacity", .95);
          tooltip.html(`
            <b style='color:#111827;font-size:14px;'>${segName}</b><br/>
            <hr style='margin:4px 0;border:none;border-top:1px solid #e5e7eb;'/>
            Giriş: <b style='color:#dc2626'>${segData.entry.toFixed(1)}</b> mM<br/>
            Çıkış: <b style='color:#dc2626'>${segData.exit.toFixed(1)}</b> mM<br/>
            Ortalama: <b>${segData.mean.toFixed(1)}</b> mM
          `)
          .style("left", (event.pageX + 15) + "px")
          .style("top", (event.pageY - 28) + "px");
        })
        .on("mouseout", function() {
          d3.select(this).style("stroke-width", 10);
          tooltip.transition().duration(200).style("opacity", 0);
        });
        
      if (segName !== "LDL" && segName !== "LAL") {
        svg.append("text")
          .attr("x", pts[0][0] - 35)
          .attr("y", pts[0][1] + 15)
          .attr("font-size", "11px")
          .attr("fill", "#6b7280")
          .text(segName);
      }
    }

    // Legend
    const legendWidth = 200;
    const legendHeight = 15;
    const legend = svg.append("g").attr("transform", `translate(${width - 250}, 30)`);
    
    const legendGrad = defs.append("linearGradient").attr("id", "legend-grad");
    for(let i=0; i<=10; i++) {
        legendGrad.append("stop")
          .attr("offset", `${i*10}%`)
          .attr("stop-color", colorScale(minV + (maxV - minV) * (i/10)));
    }
    
    legend.append("rect")
      .attr("width", legendWidth)
      .attr("height", legendHeight)
      .attr("fill", "url(#legend-grad)")
      .attr("rx", 4);
      
    legend.append("text")
      .attr("x", 0)
      .attr("y", -6)
      .attr("font-size", "12px")
      .attr("fill", "#374151")
      .text(`Konsantrasyon (${INJECTED_DATA.solute}) - mM`);
      
    legend.append("text").attr("x", 0).attr("y", legendHeight + 14).attr("font-size", "11px").text(minV.toFixed(1));
    legend.append("text").attr("x", legendWidth).attr("y", legendHeight + 14).attr("font-size", "11px").attr("text-anchor", "end").text(maxV.toFixed(1));

  </script>
</body>
</html>
